# ملف مؤقت: تحميل صورة قائمة أسعار فرع مدينة نصر من رابط postimages
# واستخراجها كـ artifact + عمل commit على الفرع الحالي.
# (الـ sandbox اللي بنشتغل فيه مش عنده صلاحية وصول لـ postimg.cc،
#  لكن runners بتاعة GitHub عندها إنترنت كامل — فالملف ده بيتشال بعدين.)
name: Fetch price list image (temporary)

on:
  push:
    paths:
      - ".github/workflows/fetch-price-image.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the price list image from postimages
        run: |
          set -euo pipefail
          mkdir -p public/images /tmp/dl
          # نسختين: الأصلية (?dl=1) والصورة المعروضة — بنختار الأكبر حجماً
          curl -fsSL -A "Mozilla/5.0" \
            "https://i.postimg.cc/1s8CwxXm/fd8e350e-c65e-4350-9254-ef1ce0464010.jpg?dl=1" \
            -o /tmp/dl/original.jpg || echo "original download failed"
          curl -fsSL -A "Mozilla/5.0" \
            "https://i.postimg.cc/T3XJv4nF/fd8e350e-c65e-4350-9254-ef1ce0464010.jpg" \
            -o /tmp/dl/display.jpg || echo "display download failed"

          ls -la /tmp/dl || true
          file /tmp/dl/*.jpg || true

          best=/tmp/dl/display.jpg
          if [ -f /tmp/dl/original.jpg ] && [ -f /tmp/dl/display.jpg ]; then
            if [ "$(stat -c%s /tmp/dl/original.jpg)" -ge "$(stat -c%s /tmp/dl/display.jpg)" ]; then
              best=/tmp/dl/original.jpg
            fi
          elif [ -f /tmp/dl/original.jpg ]; then
            best=/tmp/dl/original.jpg
          fi

          cp "$best" public/images/prices-nasr-city.jpg
          ls -la public/images/prices-nasr-city.jpg
          file public/images/prices-nasr-city.jpg
          md5sum public/images/prices-nasr-city.jpg

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prices-nasr-city
          path: public/images/prices-nasr-city.jpg
          if-no-files-found: error

      - name: Commit and push to the same branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/prices-nasr-city.jpg
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير — الصورة موجودة بالفعل"
            exit 0
          fi
          git commit -m "chore: add nasr city price list image [skip ci]"
          git push
