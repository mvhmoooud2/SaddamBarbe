# ملف مؤقت: بيحمّل صور العميل من postimg.cc ويحفظها في المستودع
# (بيتشغّل من الـ runner لأن الشبكة في بيئة التطوير محجوبة عن postimg)
name: Temp fetch client images

on:
  push:
    branches: [arena/01a0dad6-saddambarbe]
    paths: ['.github/workflows/tmp-fetch-images.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download originals
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw
          curl -fsSL --retry 3 -o /tmp/raw/1.jpg "https://i.postimg.cc/ZbL86nPx/28b2be51-d704-4aa9-ae34-c1cac28469be.jpg"
          curl -fsSL --retry 3 -o /tmp/raw/2.jpg "https://i.postimg.cc/PfrmyHKD/5c16ff53-2b1f-4bd0-a286-ef31a08252ec.jpg"
          curl -fsSL --retry 3 -o /tmp/raw/3.jpg "https://i.postimg.cc/J74bx8KB/c4aad923-40c7-4928-806d-464dc6fbc6ad.jpg"
          curl -fsSL --retry 3 -o /tmp/raw/4.jpg "https://i.postimg.cc/nVcv2xT9/c126ba21-7f6d-4fef-a1fe-39c06e8997f5.jpg"
          curl -fsSL --retry 3 -o /tmp/raw/5.jpg "https://i.postimg.cc/qBM8wrQn/d12f4fed-85c1-4aee-a7ad-6311c1e1705e.jpg"
          curl -fsSL --retry 3 -o /tmp/raw/6.jpg "https://i.postimg.cc/h4P9snMT/6d5a6eb2-ed04-4d72-b692-089a9f5250fd.jpg"
          ls -l /tmp/raw
          file /tmp/raw/*.jpg

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Report dimensions
        run: |
          identify /tmp/raw/*.jpg | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Optimize for web
        run: |
          set -euo pipefail
          mkdir -p public/images
          i=1
          for f in /tmp/raw/1.jpg /tmp/raw/2.jpg /tmp/raw/3.jpg /tmp/raw/4.jpg /tmp/raw/5.jpg /tmp/raw/6.jpg; do
            out="public/images/client-upload-$i.jpg"
            magick "$f" -auto-orient -resize '1800x1800>' -strip -interlace Plane -quality 82 "$out"
            i=$((i+1))
          done
          ls -lh public/images/client-upload-*.jpg | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -A public/images
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير — الصور موجودة بالفعل"
          else
            git commit -m "Add client gallery photos (temp fetch)"
            git push
          fi
