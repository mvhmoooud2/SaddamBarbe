# ملف مؤقت: بيحمّل صور العميل من postimg.cc بحجمها الأصلي ويحفظها في public/images
# (بيتشغّل من الـ runner لأن الشبكة في بيئة التطوير محجوبة عن postimg)
name: Temp fetch client images

on:
  push:
    branches: [arena/01a0dad6-saddambarbe]
    paths: ['.github/workflows/tmp-fetch-images.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Download originals
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw
          urls=(
            "https://i.postimg.cc/ZbL86nPx/28b2be51-d704-4aa9-ae34-c1cac28469be.jpg"
            "https://i.postimg.cc/PfrmyHKD/5c16ff53-2b1f-4bd0-a286-ef31a08252ec.jpg"
            "https://i.postimg.cc/J74bx8KB/c4aad923-40c7-4928-806d-464dc6fbc6ad.jpg"
            "https://i.postimg.cc/nVcv2xT9/c126ba21-7f6d-4fef-a1fe-39c06e8997f5.jpg"
            "https://i.postimg.cc/qBM8wrQn/d12f4fed-85c1-4aee-a7ad-6311c1e1705e.jpg"
            "https://i.postimg.cc/h4P9snMT/6d5a6eb2-ed04-4d72-b692-089a9f5250fd.jpg"
          )
          i=1
          for u in "${urls[@]}"; do
            out="/tmp/raw/$i.jpg"
            # نجرب الأول الملف الأصلي (dl=1)، ولو فشل نرجع للنسخة المعروضة
            if ! curl -fsSL --retry 3 -A "Mozilla/5.0" -o "$out" "$u?dl=1" || ! file "$out" | grep -q JPEG; then
              echo "fallback للنسخة المعروضة للصورة $i"
              curl -fsSL --retry 4 -A "Mozilla/5.0" -o "$out" "$u"
            fi
            i=$((i+1))
          done
          file /tmp/raw/*.jpg

      - name: Report original dimensions
        run: identify /tmp/raw/*.jpg | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Optimize and save into public/images
        run: |
          set -euo pipefail
          mkdir -p public/images
          for i in 1 2 3 4 5 6; do
            convert "/tmp/raw/$i.jpg" -auto-orient -resize '1920x1920>' -strip \
              -interlace Plane -quality 82 "public/images/gallery-$i.jpg"
          done
          identify public/images/gallery-*.jpg | tee -a "$GITHUB_STEP_SUMMARY"
          ls -lh public/images/gallery-*.jpg | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -A public/images
          if git diff --cached --quiet; then
            echo "مفيش تغيير"
          else
            git commit -m "Add client gallery photos"
            git push
          fi
